# Local stack mirroring compose.production.yml: same PHP, MariaDB, nginx config, queue, Reverb, scheduler.
# Differences from prod: source is bind-mounted, dev php.ini (opcache revalidates), composer available.

# Only the php service builds the image; queue/reverb/scheduler reuse it,
# otherwise compose builds the same Dockerfile in parallel for every service.
x-php: &php
  image: fitness-php-dev
  pull_policy: never
  restart: unless-stopped
  init: true
  volumes:
    - ./:/var/www/html:delegated
  depends_on:
    db:
      condition: service_healthy
  networks:
    - fitness-network

services:
  php:
    <<: *php
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: fitness-php

  nginx:
    image: nginx:1.24.0-alpine
    container_name: fitness-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/production/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php
      - reverb
    networks:
      - fitness-network

  db:
    image: mariadb:10.11.19
    container_name: fitness-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fitness}
      MYSQL_USER: ${DB_USERNAME:-fitness}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_AUTO_UPGRADE: '1'
      TZ: Etc/GMT-5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+05:00
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mariadb --protocol=tcp -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks:
      - fitness-network

  queue:
    <<: *php
    container_name: fitness-queue
    command: [php, artisan, queue:work, --tries=3, --no-interaction]

  reverb:
    <<: *php
    container_name: fitness-reverb
    command: [php, artisan, reverb:start, --host=0.0.0.0, --port=8080, --no-interaction]

  scheduler:
    <<: *php
    container_name: fitness-scheduler
    profiles: [scheduler]
    command: [php, artisan, schedule:work, --no-interaction]

networks:
  fitness-network:
    driver: bridge

volumes:
  mariadb-data:
