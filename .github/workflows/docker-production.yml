name: Docker production images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: app
            image: ghcr.io/sqweez/fitness-backend-php
          - target: web
            image: ghcr.io/sqweez/fitness-backend-nginx
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_DIR: /var/www/vhosts/ariesdev.kz/api.gladiatory.ariesdev.kz
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload compose file
        run: scp compose.production.yml "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/compose.production.yml"

      - name: Pull and restart containers
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            cd $APP_DIR
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose -f compose.production.yml --env-file .env.production pull
            docker compose -f compose.production.yml --env-file .env.production up -d --remove-orphans
            docker logout ghcr.io
          "
