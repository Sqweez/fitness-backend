openapi: 3.0.3
info:
  title: Gladiators Mobile API
  description: Контракт мобильного API спортивного клуба Gladiators (префикс /api/mobile/v1).
  version: 1.0.0

servers:
  - url: https://api.gladiatory.ariesdev.kz/api/mobile/v1
    description: Production / Staging
  - url: http://localhost:8080/api/mobile/v1
    description: Local Docker
  - url: http://127.0.0.1:8000/api/mobile/v1
    description: Local Artisan Serve

paths:
  /auth/code:
    post:
      summary: Запрос кода подтверждения
      description: |
        Отправляет SMS/мессенджер код существующему клиенту клуба (пока заглушка на 111111).
        Действует 5 минут. Повторный запрос не сбрасывает счётчик попыток.
      operationId: sendAuthCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      responses:
        '200':
          description: Код успешно запрошен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCodeResponse'
        '404':
          description: Клиент с таким номером не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: PHONE_NOT_FOUND
                  message: Клиент с таким номером телефона не найден
        '409':
          description: Номер дублируется у нескольких клиентов в базе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: PHONE_AMBIGUOUS
                  message: Обратитесь к администратору для уточнения номера
        '422':
          description: Ошибка валидации формата телефона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The phone format is invalid.
        '429':
          description: Превышен лимит запросов (cooldown 60 сек, 3/час, 5/сутки или IP throttle)
          headers:
            Retry-After:
              description: Количество секунд до следующей попытки
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                error:
                  code: RATE_LIMITED
                  message: Слишком много попыток. Попробуйте позже
                  retry_after_seconds: 60

  /auth/verify:
    post:
      summary: Проверка кода и выдача токена
      description: |
        Проверяет 6-значный код. При успехе возвращает бессрочный Bearer-токен Sanctum.
        Максимум 5 неверных попыток, после чего блокируется до истечения 5-минутного запроса.
      operationId: verifyAuthCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: Успешная авторизация, токен выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyCodeResponse'
        '404':
          description: Клиент с таким номером не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: PHONE_NOT_FOUND
                  message: Клиент с таким номером телефона не найден
        '409':
          description: Конфликт владельца номера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: PHONE_AMBIGUOUS
                  message: Обратитесь к администратору для уточнения номера
        '422':
          description: Неверный или истёкший код, либо ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidCode:
                  summary: Неверный код
                  value:
                    error:
                      code: INVALID_CODE
                      message: Неверный код подтверждения
                codeExpired:
                  summary: Код истёк или уже использован
                  value:
                    error:
                      code: CODE_EXPIRED
                      message: Срок действия кода истёк
                validationError:
                  summary: Невалидный формат полей
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The code format is invalid.
        '429':
          description: Блокировка после 5 неверных попыток
          headers:
            Retry-After:
              description: Количество секунд ожидания
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                error:
                  code: RATE_LIMITED
                  message: Слишком много попыток. Попробуйте позже
                  retry_after_seconds: 240

  /auth/logout:
    post:
      summary: Выход из профиля
      description: Отзывает текущий токен клиента. Другие устройства/токены остаются активными.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Успешный выход, токен удалён (тело пустое)
        '401':
          description: Токен не передан, недействителен или клиент удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Необходима авторизация

  /me:
    get:
      summary: Профиль авторизованного клиента
      description: |
        Возвращает имя и фамилию владельца мобильного токена.
        Фамилия — первое слово существующего поля name, имя — второе.
        Отчество не включается. ID клиента передавать не требуется.
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Имя и фамилия клиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfileResponse'
        '401':
          description: Токен не передан, недействителен или клиент удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Необходима авторизация
        '429':
          description: Превышен общий API-лимит запросов
          headers:
            Retry-After:
              description: Количество секунд ожидания
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /me/membership:
    get:
      summary: Текущие абонементы клиента
      description: |
        Возвращает все текущие программы и безлимиты владельца токена от новых покупок к старым.
        Истёкшие и полностью использованные абонементы, а также солярий не включаются.
        Замороженные абонементы остаются в списке, даже если исходная дата окончания прошла.
        Замороженные и ещё не активированные абонементы имеют active=false.
        Остаток учитывает посещения и подтверждённые штрафные списания.
        message отображается приложением, только если нет ни одного активного абонемента.
      operationId: getMyMemberships
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список текущих абонементов; отсутствие абонементов — успешный ответ с пустым массивом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipsResponse'
        '401':
          description: Токен не передан, недействителен или клиент удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Необходима авторизация
        '429':
          description: Превышен общий API-лимит запросов
          headers:
            Retry-After:
              description: Количество секунд ожидания
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /me/trinket:
    get:
      summary: Выданный ключ от шкафчика
      description: |
        Возвращает номер шкафчика по ключу, привязанному к незавершённому посещению владельца токена.
        Если ключ не выдан или посещение завершено, data=null.
        Номер шкафчика возвращается строкой; код брелока не передаётся.
      operationId: getMyTrinket
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Номер шкафчика или отсутствие выданного ключа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrinketResponse'
              examples:
                assigned:
                  value:
                    data:
                      number: '17'
                notAssigned:
                  value:
                    data: null
        '401':
          description: Токен не передан, недействителен или клиент удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Необходима авторизация
        '429':
          description: Превышен общий API-лимит запросов
          headers:
            Retry-After:
              description: Количество секунд ожидания
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /me/pass:
    get:
      summary: Штрихкод карты клиента
      description: |
        Возвращает исходный код карты, привязанной к владельцу мобильного токена, в формате CODE128.
        Код передаётся строкой с сохранением ведущих нулей и не требует периодического обновления.
        Наличие активного абонемента не проверяется. Если карта не выдана, возвращается PASS_UNAVAILABLE.
      operationId: getMyPass
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Код и формат штрихкода выданной карты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassResponse'
        '401':
          description: Токен не передан, недействителен или клиент удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Необходима авторизация
        '403':
          description: Клиенту не выдана карта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: PASS_UNAVAILABLE
                  message: Карта клиента не выдана
        '429':
          description: Превышен общий API-лимит запросов
          headers:
            Retry-After:
              description: Количество секунд ожидания
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    PassResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Pass'

    Pass:
      type: object
      required:
        - code
        - format
      properties:
        code:
          type: string
          example: '0006287938'
        format:
          type: string
          enum: [CODE128]
          example: CODE128

    TrinketResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Trinket'

    Trinket:
      type: object
      nullable: true
      required:
        - number
      properties:
        number:
          type: string
          example: '17'

    MembershipsResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MembershipsData'

    MembershipsData:
      type: object
      required:
        - memberships
        - message
      properties:
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        message:
          type: string
          example: Поможем выбрать подходящий тариф. Напишите администратору или оформите абонемент на ресепшене клуба.

    Membership:
      type: object
      required:
        - id
        - title
        - active
        - limited
        - visits_left
        - visits_total
        - valid_until
      properties:
        id:
          type: string
          description: ID купленного абонемента
          example: '123'
        title:
          type: string
          example: Тренажёрный зал
        active:
          type: boolean
          description: Возможность использовать абонемент по текущим правилам клуба
          example: true
        limited:
          type: boolean
          example: true
        visits_left:
          type: integer
          nullable: true
          description: Остаток посещений; null для безлимита
          example: 12
        visits_total:
          type: integer
          nullable: true
          description: Начальное количество посещений; null для безлимита
          example: 16
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: Конец последнего дня действия; null до активации
          example: '2026-11-23T23:59:59+05:00'

    ClientProfileResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ClientProfile'

    ClientProfile:
      type: object
      required:
        - first_name
        - last_name
      properties:
        first_name:
          type: string
          example: Алексей
        last_name:
          type: string
          example: Иванов

    ErrorCode:
      type: string
      description: Символьный код ошибки для клиентской логики
      enum:
        - PHONE_NOT_FOUND
        - PHONE_AMBIGUOUS
        - INVALID_CODE
        - CODE_EXPIRED
        - VALIDATION_ERROR
        - RATE_LIMITED
        - UNAUTHORIZED
        - PASS_UNAVAILABLE

    SendCodeRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          pattern: '^\+77[0-9]{9}$'
          example: '+77011234567'
          description: Номер телефона в формате +77XXXXXXXXX (11 цифр)

    SendCodeResponse:
      type: object
      required:
        - code_length
        - retry_after_seconds
      properties:
        code_length:
          type: integer
          example: 6
          description: Длина ожидаемого проверочного кода
        retry_after_seconds:
          type: integer
          example: 60
          description: Минимальная пауза в секундах до возможности повторного запроса

    VerifyCodeRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          pattern: '^\+77[0-9]{9}$'
          example: '+77011234567'
          description: Номер телефона в формате +77XXXXXXXXX
        code:
          type: string
          pattern: '^[0-9]{6}$'
          example: '111111'
          description: 6-значный цифровой проверочный код

    VerifyCodeResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: '1|4A89fbc789e0...'
          description: Бессрочный Bearer-токен Sanctum для последующих запросов

    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              example: Сообщение об ошибке на русском языке

    RateLimitError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retry_after_seconds
          properties:
            code:
              type: string
              enum: [RATE_LIMITED]
            message:
              type: string
              example: Слишком много попыток. Попробуйте позже
            retry_after_seconds:
              type: integer
              example: 60
              description: Количество секунд ожидания до следующего разрешенного запроса
